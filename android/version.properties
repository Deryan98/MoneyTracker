# Fuente de verdad de versionCode/versionName para los tres flavors
# (dev/qa/prod comparten un unico contador — ver razonamiento en
# scripts/bump-version.js). Leido por android/app/build.gradle en cada
# build y escrito por `yarn build:*` antes de compilar. No editar
# VERSION_CODE a mano hacia abajo: Play rechaza un valor <= al ya
# subido, y esta app lo trata como monotonico desde ya aunque todavia
# no este publicada.
#
# Arranca en 3 / 1.0.2 para no retroceder frente a lo que ya estaba
# hardcodeado en build.gradle antes de esta migracion.
VERSION_CODE=3
VERSION_NAME=1.0.2
